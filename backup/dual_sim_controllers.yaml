mujoco_server:
  ros__parameters:
    MujocoPlugins:
      names:
        - mujoco_ros2_control
        - mujoco_ros_sensors
      mujoco_ros2_control:
        type: mujoco_ros2_control::MujocoRos2ControlPlugin
        hardware:
          type: mujoco_ros_control/RobotHW
          control_period: 0.001
        params:
          namespace: ""
          robot_description_node: "robot_state_publisher"
          robot_description: "robot_description"
      mujoco_ros_sensors:     # <--- 2. Configura il plugin sensori
        type: mujoco_ros_sensors::MujocoRosSensorsPlugin
        publish_rate: 60.0
        

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    franka_left_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
    franka_right_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
    franka_left_robot_model_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotModelBroadcaster
    franka_right_robot_model_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotModelBroadcaster
    dual_joint_impedance_controller:
      type: alberto_controllers/panda/DualJointImpedanceController
    dual_joint_velocity_controller:
      type: alberto_controllers/panda/DualJointVelocityController
   
    
franka_left_robot_state_broadcaster:
  ros__parameters:
    arm_id: mj_left
    frequency: 30

franka_right_robot_state_broadcaster:
  ros__parameters:
    arm_id: mj_right
    frequency: 30

franka_left_robot_model_broadcaster:
  ros__parameters:
    arm_id: mj_left
    frequency: 30

franka_right_robot_model_broadcaster:
  ros__parameters:
    arm_id: mj_right
    frequency: 30
    
dual_joint_impedance_controller:
  ros__parameters:
    command_topic: /joint_velocities
    arm_count: 2
    arm_1:
      arm_id: mj_left
      k_gains:
        - 225.0
        - 225.0
        - 225.0
        - 225.0
        - 81.0
        - 36.0
        - 16.0
      d_gains:
        - 30.0
        - 30.0
        - 30.0
        - 30.0
        - 18.0
        - 12.0
        - 8.0
    arm_2:
      arm_id: mj_right
      k_gains:
        - 225.0
        - 225.0
        - 225.0
        - 225.0
        - 81.0
        - 36.0
        - 16.0
      d_gains:
        - 30.0
        - 30.0
        - 30.0
        - 30.0
        - 18.0
        - 12.0
        - 8.0
    
dual_joint_velocity_controller:
  ros__parameters:
    command_topic: /dual_joint_velocities
    arm_1:
      arm_id: mj_left
    arm_2:
      arm_id: mj_right

